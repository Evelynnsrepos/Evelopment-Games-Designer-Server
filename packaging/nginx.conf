# Example nginx site for the Evelopment server (wizard mode: "Behind nginx or another web server").
# Public address for the wizard: wss://games.example.com/sync
# Get a certificate first, e.g. with: certbot --nginx -d games.example.com

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 off;                       # WebSocket upgrade needs HTTP/1.1
    server_name games.example.com;

    ssl_certificate     /etc/letsencrypt/live/games.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/games.example.com/privkey.pem;
    ssl_protocols TLSv1.3;           # BSI TR-02102-2; add TLSv1.2 only if old clients need it

    access_log off;                  # no IP addresses in logs (the server keeps none either)
    error_log /var/log/nginx/egd-error.log crit;

    # Only the sync endpoint is public. The admin page stays on 127.0.0.1:8475 (use an SSH tunnel).
    location = /sync {
        proxy_pass http://127.0.0.1:8474;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;   # turn on "Behind a reverse proxy" in the server's settings
        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }
}
