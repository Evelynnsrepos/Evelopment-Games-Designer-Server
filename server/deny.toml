# cargo deny check: known vulnerabilities, licenses compatible with GPL-3.0, crates only from crates.io.
[advisories]
version = 2
yanked = "deny"
ignore = [
  # smallstr is unmaintained (not a vulnerability). It only comes in through yrs; drop this once yrs replaces it.
  { id = "RUSTSEC-2026-0215", reason = "unmaintained, transitive via yrs, no known vulnerability" },
]

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
  "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "MPL-2.0", "OpenSSL", "BSL-1.0", "CDLA-Permissive-2.0", "GPL-3.0-only",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
