[package]
name = "egd-server"
version = "0.8.0"
license = "GPL-3.0-only"
description = "Sync server for Evelopment Games Designer"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
base64 = "0.23.1"
futures-util = "0.3.34"
getrandom = "0.4.3"
rcgen = "0.14.10"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = "0.23.45"
rustls-acme = { version = "0.15.4", features = ["axum"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tao = { version = "0.37", optional = true }
tokio = { version = "1.53.1", features = ["full"] }
tray-icon = { version = "0.25", optional = true }
yrs = "0.28.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[features]
default = []
# Tray icon with a menu (open admin page, quit). Built for the Windows and macOS downloads.
tray = ["dep:tray-icon", "dep:tao"]
